[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cricket2"
version = "0.1.0"
description = "Trace compiler for GRiD/GLASS rigid-body kernels: thread, warp and block CUDA from one algorithm source"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: CUDA",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
# URDFParser (and RBDReference, the oracle) come from GRiD: an installed GRiD, else the GRiD
# checkout next to cricket2 (CRICKET2_GRID_PATH overrides). Pinocchio is the second oracle.
test = ["pytest>=7.0", "pin", "pytest-gpu-proof>=0.4.1"]

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["cricket2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python", "tests"]
markers = ["gpu_proof: recorded in the signed pytest-gpu-proof receipt (every test in tests/test_cuda.py)."]

[tool.gpu_proof]
# Record on a GPU, commit gpu-proof.json, verify CPU-only (GRiM's test/verify_gpu_proofs.sh):
#   python -m pytest tests/test_cuda.py --gpu-proof-enable
#   gpu-proof verify --receipt gpu-proof.json --policy tests/gpu-proof-policy.yaml
mode = "local"
output = "gpu-proof.json"
github_username = "saiccoumar"
required_marker = "gpu_proof"
fingerprint_paths = ["python/cricket2", "pyproject.toml", "resources", "tests"]
fingerprint_excluded_paths = ["gpu-proof.json"]
max_age_days = 30
